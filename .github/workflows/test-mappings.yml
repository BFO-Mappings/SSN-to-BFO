name: Validate Authoritative COMS Mapping

"on":
  pull_request:
    branches:
      - main
      - dev
      - tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative_coms_mapping:
    name: Validate authoritative COMS mapping
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install openpyxl==3.1.5 rdflib==7.6.0

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"

      - name: Install verified ROBOT 1.9.7
        env:
          ROBOT_SHA256: 91890c2e83d0f092dd08731376f154b36610544cfbe8685337a1bf7244ccaa2d
        run: |
          set -euo pipefail
          robot_dir="${RUNNER_TEMP}/robot"
          bin_dir="${RUNNER_TEMP}/bin"
          robot_jar="${robot_dir}/robot.jar"
          mkdir -p "${robot_dir}" "${bin_dir}"
          curl --fail --location --silent --show-error \
            --output "${robot_jar}" \
            https://github.com/ontodev/robot/releases/download/v1.9.7/robot.jar
          printf '%s  %s\n' "${ROBOT_SHA256}" "${robot_jar}" | sha256sum --check -
          printf '#!/usr/bin/env bash\nexec java -Xmx4G -jar "%s" "$@"\n' \
            "${robot_jar}" > "${bin_dir}/robot"
          chmod +x "${bin_dir}/robot"
          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Verify tool versions
        run: |
          set -euo pipefail
          python --version
          java -version
          robot_version="$(robot --version 2>&1)"
          printf '%s\n' "${robot_version}"
          if ! grep -Eq '(^|[^0-9])1\.9\.7([^0-9]|$)' <<< "${robot_version}"; then
            echo "Expected ROBOT 1.9.7, got: ${robot_version}" >&2
            exit 1
          fi
          python - <<'PY'
          import openpyxl
          import rdflib

          print(f"openpyxl {openpyxl.__version__}")
          print(f"rdflib {rdflib.__version__}")
          PY

      - name: Validate authoritative COMS mapping
        run: make check

      - name: Verify validation did not modify the repository
        run: |
          git status --short
          test -z "$(git status --porcelain)"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authoritative-coms-validation-diagnostics
          path: |
            /tmp/ssn-to-bfo-validation-suite/
            .cache/coms/last-failure.log
          if-no-files-found: ignore
